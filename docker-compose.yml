version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: postgres_container
    environment:
      POSTGRES_USER: admin           
      POSTGRES_PASSWORD: securepass  
      POSTGRES_DB: itqreestr       
    ports:
      - "5455:5432"                  
    volumes:
      - postgres_data:/var/lib/postgresql/data
      #- ./init.sql:/docker-entrypoint-initdb.d/init.sql 
    restart: unless-stopped          
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d itqreestr"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  reestr-app:
    build: ./reestr  
    image: reestr:latest
    container_name: reestr_container
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/itqreestr
      SPRING_DATASOURCE_USERNAME: admin          
      SPRING_DATASOURCE_PASSWORD: securepass
    ports:
      - "8100:8100"
    restart: unless-stopped
    healthcheck:
      #test: ["CMD-SHELL", "curl -f http://localhost:8100/actuator/health || exit 1"]
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8100/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 10s
    networks:
      - app-network
      
  util-app:
    build: ./util
    image: util:latest
    container_name: util_container
    depends_on:
      reestr-app:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/itqreestr
      SPRING_DATASOURCE_USERNAME: admin          
      SPRING_DATASOURCE_PASSWORD: securepass
      REESTR_URL: http://reestr-app:8100
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      #test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 10s
    networks:
      - app-network    

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge