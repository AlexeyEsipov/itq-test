spring.application.name=util
server.port=8081

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=jdbc:postgresql://localhost:5432/itqreestr
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.order_by.default_null_ordering=last

reestr.url=http://localhost:8100

count.generated.docs=100
count.batchsize.docs=20

task.executor.pool.size=5

task.executor.keepalive.seconds=60

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.use-fqn=true

api.common.version=1.0.0
api.common.title=Batch Utility
api.common.description=API for managing batch documents
api.common.termsOfService=Submit, Approve and Generate Documents
api.common.contact.name=Esipov Aleksey
api.common.contact.url=https://github.com/AlexeyEsipov
api.common.contact.email=a_esipov_it@list.ru

feign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.sliding-window-type=COUNT_BASED

resilience4j.ratelimiter.instances.userServiceRateLimiter.limit-for-period=150
resilience4j.ratelimiter.instances.userServiceRateLimiter.limit-refresh-period=1s
resilience4j.ratelimiter.instances.userServiceRateLimiter.timeout-duration=0

resilience4j.bulkhead.instances.userServiceBulkhead.max-concurrent-calls=3
resilience4j.bulkhead.instances.userServiceBulkhead.max-wait-duration=0

resilience4j.retry.instances.reestrService.max-attempts=3
resilience4j.retry.instances.reestrService.wait-duration=500ms
resilience4j.retry.instances.reestrService.retry-exceptions=ru.itq.util.exception.ServerErrorException,java.io.IOException,feign.RetryableException
resilience4j.retry.instances.reestrService.ignore-exceptions=ru.itq.util.exception.ClientErrorException



